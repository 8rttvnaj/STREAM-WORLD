
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>STREAM WORLD</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
header{padding:22px 16px;text-align:center;background:#101010;border-bottom:1px solid #292929}
.logo{font-size:clamp(30px,7vw,48px);font-weight:900;letter-spacing:3px}
.logo span{color:#f01825;text-shadow:0 0 15px #f01825}
main{max-width:1000px;margin:auto;padding:18px}
.search-area{display:grid;gap:10px;margin:15px 0}
input,select{width:100%;padding:14px;border:1px solid #444;border-radius:9px;background:#171717;color:white}
button{padding:13px 17px;border:0;border-radius:9px;background:#e50920;color:white;font-weight:bold}
.search-row{display:flex;gap:8px}
.search-row input{flex:1;min-width:0}
h2{font-size:21px;margin:28px 0 13px}
.services{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.service{background:#171717;border:1px solid #333;border-radius:12px;padding:18px 10px;text-align:center;text-decoration:none;color:white;min-height:90px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold}
.service:active{transform:scale(.97)}
.service span{display:block}
.npo{border-color:#e64a35}
.plex{border-color:#e5a800}
.youtube{border-color:#e50920}
.kijk{border-color:#ef7d24}
.school{border-color:#42a5f5}
.klokhuis{border-color:#70b94c}
.panel{background:#151515;border:1px solid #333;border-radius:12px;padding:16px;margin-top:14px}
#results{display:grid;gap:8px}
.result{display:block;color:white;background:#202020;padding:12px;border-radius:8px;text-decoration:none}
#gameCanvas{display:block;width:100%;max-width:420px;height:auto;background:linear-gradient(#75c9e8,#d7f4ff);border-radius:10px;margin:12px auto}
.game-buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
footer{text-align:center;color:#777;padding:30px 10px}

/* STREAM WORLD INTRO */
#intro{
 position:fixed;inset:0;z-index:9999;background:#020202;
 display:flex;align-items:center;justify-content:center;
 overflow:hidden;perspective:1000px;
}
.intro-glow{
 position:absolute;width:65vw;height:65vw;max-width:600px;max-height:600px;
 border-radius:50%;background:radial-gradient(circle,rgba(220,0,15,.28),transparent 68%);
 animation:glowPulse 3s ease-in-out infinite;
}
#particles{position:absolute;inset:0;overflow:hidden}
.particle{
 position:absolute;width:3px;height:3px;border-radius:50%;
 background:#ff2535;box-shadow:0 0 9px #ff1428;
 animation:particleMove var(--duration) linear infinite;
}
.intro-content{
 position:relative;text-align:center;width:100%;padding:20px;
 animation:introZoom 2s cubic-bezier(.15,.8,.2,1) both;
}
.intro-logo{
 font-size:clamp(36px,10vw,82px);font-weight:1000;
 letter-spacing:clamp(2px,1vw,9px);
 color:white;white-space:nowrap;
 text-shadow:0 0 10px #ff172b,0 0 28px #e50920,0 0 65px #e50920;
 animation:neonPulse 1.5s ease-in-out infinite alternate;
}
.intro-logo span{color:#f01825}
.intro-laser{
 height:3px;width:0;margin:22px auto;background:#ff1428;
 box-shadow:0 0 12px #ff1428,0 0 30px #ff1428;
 animation:laserMove 1.4s ease-out 1.4s forwards;
}
.intro-sub{
 opacity:0;letter-spacing:3px;font-size:clamp(11px,3vw,16px);
 animation:subAppear 1s ease 2.6s forwards;
}
#startButton{
 opacity:0;margin-top:30px;padding:14px 30px;border:1px solid #ff2637;
 background:#e50920;color:white;border-radius:7px;
 box-shadow:0 0 18px #e50920;
 animation:buttonAppear .8s ease 3.2s forwards;
}
#intro.closing{animation:introOut .8s ease forwards;pointer-events:none}
@keyframes introZoom{
 0%{opacity:0;transform:translateZ(-700px) scale(.25) rotateX(20deg)}
 65%{opacity:1;transform:translateZ(70px) scale(1.12)}
 100%{opacity:1;transform:translateZ(0) scale(1)}
}
@keyframes neonPulse{
 from{text-shadow:0 0 8px #ff172b,0 0 20px #e50920}
 to{text-shadow:0 0 18px #ff172b,0 0 40px #e50920,0 0 75px #e50920}
}
@keyframes laserMove{to{width:min(75%,650px)}}
@keyframes subAppear{to{opacity:1;transform:translateY(0)}}
@keyframes buttonAppear{to{opacity:1}}
@keyframes glowPulse{50%{transform:scale(1.2);opacity:.65}}
@keyframes particleMove{
 0%{transform:translate3d(0,110vh,0) scale(.5);opacity:0}
 15%{opacity:1}
 100%{transform:translate3d(var(--drift),-20vh,0) scale(1.4);opacity:0}
}
@keyframes introOut{to{opacity:0;visibility:hidden}}
@media(min-width:650px){.services{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>

<body>

<!-- GEANIMEERDE INTRO -->
<div id="intro">
 <div class="intro-glow"></div>
 <div id="particles"></div>
 <div class="intro-content">
  <div class="intro-logo">STREAM <span>WORLD</span></div>
  <div class="intro-laser"></div>
  <div class="intro-sub">JOUW WERELD. JOUW ENTERTAINMENT.</div>
  <button id="startButton">START NU ▶</button>
 </div>
</div>

<header>
 <div class="logo">STREAM <span>WORLD</span></div>
</header>

<main>

<!-- ZOEKEN EN TAAL -->
<div class="search-area">
 <form class="search-row" id="internalForm">
  <input id="internalSearch" placeholder="Zoek op STREAM WORLD...">
  <button type="submit">ZOEK</button>
 </form>

 <form class="search-row" id="onlineForm">
  <input id="onlineSearch" placeholder="Zoek online op internet...">
  <button type="submit">ONLINE ZOEKEN</button>
 </form>

 <select id="language" aria-label="Taalkeuze">
  <option value="nl">🇳🇱 Nederlands</option>
  <option value="en">🇬🇧 English</option>
  <option value="de">🇩🇪 Deutsch</option>
 </select>
</div>

<div id="results"></div>

<!-- STREAMINGDIENSTEN -->
<h2>📺 STREAMING & KIJKEN</h2>
<div class="services" id="serviceList">
 <a class="service npo" href="https://npo.nl/start" target="_blank" rel="noopener">NPO START</a>
 <a class="service plex" href="https://watch.plex.tv/" target="_blank" rel="noopener">PLEX</a>
 <a class="service youtube" href="https://www.youtube.com/" target="_blank" rel="noopener">▶ YOUTUBE</a>
 <a class="service kijk" href="https://www.kijk.nl/" target="_blank" rel="noopener">KIJK</a>
 <a class="service school" href="https://schooltv.nl/" target="_blank" rel="noopener">SCHOOLTV</a>
 <a class="service klokhuis" href="https://www.hetklokhuis.nl/" target="_blank" rel="noopener">HET KLOKHUIS</a>
</div>

<!-- FLAPPY BIRD -->
<h2>🐤 FLAPPY BIRD</h2>
<div class="panel">
 <p style="text-align:center">Tik op het scherm of druk op de knop om te vliegen!</p>
 <canvas id="gameCanvas" width="420" height="520"></canvas>
 <div class="game-buttons">
  <button id="flyButton">🐤 VLIEG!</button>
  <button id="restartButton">OPNIEUW</button>
 </div>
 <p id="score" style="text-align:center">Score: 0</p>
</div>

<!-- MUZIEK ZOEKEN -->
<h2>🎵 MUZIEK ZOEKEN</h2>
<div class="panel">
 <form class="search-row" id="musicForm">
  <input id="musicSearch" placeholder="Zoek een liedje of artiest...">
  <button type="submit">ZOEK MUZIEK</button>
 </form>
</div>

</main>

<footer>STREAM WORLD ©</footer>

<script>
// INTRO: rode bewegende deeltjes, zonder introgeluid
const intro=document.getElementById("intro");
const particleArea=document.getElementById("particles");

for(let i=0;i<55;i++){
 const p=document.createElement("i");
 p.className="particle";
 p.style.left=Math.random()*100+"%";
 p.style.top=Math.random()*100+"%";
 p.style.setProperty("--duration",(4+Math.random()*7)+"s");
 p.style.setProperty("--drift",(Math.random()*180-90)+"px");
 p.style.animationDelay=(-Math.random()*9)+"s";
 particleArea.appendChild(p);
}

function closeIntro(){
 if(intro.classList.contains("closing"))return;
 intro.classList.add("closing");
 setTimeout(()=>intro.remove(),850);
}
document.getElementById("startButton").addEventListener("click",closeIntro);
setTimeout(closeIntro,9000);

// ONLINE ZOEKEN
document.getElementById("onlineForm").addEventListener("submit",e=>{
 e.preventDefault();
 const q=document.getElementById("onlineSearch").value.trim();
 if(q)window.open("https://www.google.com/search?q="+encodeURIComponent(q),"_blank");
});

// INTERNE ZOEKEN
const internalForm=document.getElementById("internalForm");
const internalInput=document.getElementById("internalSearch");
const results=document.getElementById("results");

internalForm.addEventListener("submit",e=>{
 e.preventDefault();
 const q=internalInput.value.trim().toLowerCase();
 results.innerHTML="";
 if(!q)return;
 const services=[...document.querySelectorAll("#serviceList a")];
 const matches=services.filter(a=>a.textContent.toLowerCase().includes(q));
 if(matches.length){
  matches.forEach(a=>{
   const link=document.createElement("a");
   link.className="result";
   link.href=a.href;
   link.target="_blank";
   link.rel="noopener";
   link.textContent=a.textContent+" ↗";
   results.appendChild(link);
  });
 }else{
  results.textContent="Geen resultaten gevonden op STREAM WORLD.";
 }
});

// TAALKEUZE
const translations={
 nl:{internal:"Zoek op STREAM WORLD...",online:"Zoek online op internet...",search:"ZOEK",onlineButton:"ONLINE ZOEKEN"},
 en:{internal:"Search STREAM WORLD...",online:"Search the internet...",search:"SEARCH",onlineButton:"SEARCH ONLINE"},
 de:{internal:"STREAM WORLD durchsuchen...",online:"Im Internet suchen...",search:"SUCHEN",onlineButton:"ONLINE SUCHEN"}
};
document.getElementById("language").addEventListener("change",e=>{
 const t=translations[e.target.value];
 document.getElementById("internalSearch").placeholder=t.internal;
 document.getElementById("onlineSearch").placeholder=t.online;
 internalForm.querySelector("button").textContent=t.search;
 document.querySelector("#onlineForm button").textContent=t.onlineButton;
});

// MUZIEK ZOEKEN
document.getElementById("musicForm").addEventListener("submit",e=>{
 e.preventDefault();
 const q=document.getElementById("musicSearch").value.trim();
 if(q)window.open("https://www.youtube.com/results?search_query="+encodeURIComponent(q)," _blank".trim());
});

// FLAPPY BIRD
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");
const scoreText=document.getElementById("score");
let bird,pipes,score,playing,frame;
let audioContext=null;

function chickenSound(){
 try{
  audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();
  if(audioContext.state==="suspended")audioContext.resume();
  const osc=audioContext.createOscillator();
  const gain=audioContext.createGain();
  osc.type="triangle";
  osc.frequency.setValueAtTime(650,audioContext.currentTime);
  osc.frequency.exponentialRampToValueAtTime(260,audioContext.currentTime+.12);
  osc.frequency.exponentialRampToValueAtTime(480,audioContext.currentTime+.2);
  gain.gain.setValueAtTime(.16,audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.22);
  osc.connect(gain);
  gain.connect(audioContext.destination);
  osc.start();
  osc.stop(audioContext.currentTime+.23);
 }catch(err){}
}

function resetGame(){
 bird={x:95,y:230,velocity:0};
 pipes=[];
 score=0;
 frame=0;
 playing=true;
 scoreText.textContent="Score: 0";
}

function flap(){
 if(!playing){resetGame();return;}
 bird.velocity=-6.5;
 chickenSound();
}

function drawBird(){
 ctx.save();
 ctx.translate(bird.x,bird.y);
 ctx.fillStyle="#ffdc24";
 ctx.beginPath();
 ctx.arc(0,0,15,0,Math.PI*2);
 ctx.fill();
 ctx.fillStyle="white";
 ctx.beginPath();
 ctx.arc(7,-5,5,0,Math.PI*2);
 ctx.fill();
 ctx.fillStyle="#111";
 ctx.beginPath();
 ctx.arc(9,-5,2,0,Math.PI*2);
 ctx.fill();
 ctx.fillStyle="#f47b20";
 ctx.beginPath();
 ctx.moveTo(13,1);
 ctx.lineTo(25,5);
 ctx.lineTo(13,9);
 ctx.fill();
 ctx.fillStyle="#e43b35";
 ctx.beginPath();
 ctx.arc(-3,-15,5,0,Math.PI*2);
 ctx.fill();
 ctx.restore();
}

function endGame(){
 playing=false;
 scoreText.textContent="Game over! Score: "+score+" — druk op OPNIEUW.";
}

function loop(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle="#b9e9f7";
 ctx.fillRect(0,0,420,520);

 ctx.fillStyle="#70bd45";
 ctx.fillRect(0,490,420,30);

 if(playing){
  frame++;
  bird.velocity+=.32;
  bird.y+=bird.velocity;

  if(frame%95===0){
   const gap=145;
   const top=60+Math.random()*210;
   pipes.push({x:430,top:top,gap:gap,passed:false});
  }

  pipes.forEach(p=>{
   p.x-=2.5;
   ctx.fillStyle="#329c42";
   ctx.fillRect(p.x,0,55,p.top);
   ctx.fillRect(p.x,p.top+p.gap,55,520-p.top-p.gap-30);
   ctx.fillStyle="#267d35";
   ctx.fillRect(p.x-4,p.top-12,63,12);
   ctx.fillRect(p.x-4,p.top+p.gap,63,12);

   if(!p.passed&&p.x+55<bird.x){
    p.passed=true;
    score++;
    scoreText.textContent="Score: "+score;
   }

   if(bird.x+12>p.x&&bird.x-12<p.x+55&&
      (bird.y-12<p.top||bird.y+12>p.top+p.gap))endGame();
  });
  pipes=pipes.filter(p=>p.x>-70);

  if(bird.y>478||bird.y<0)endGame();
 }

 drawBird();

 if(!playing){
  ctx.fillStyle="rgba(0,0,0,.5)";
  ctx.fillRect(0,0,420,520);
  ctx.fillStyle="white";
  ctx.textAlign="center";
  ctx.font="bold 25px Arial";
  ctx.fillText("FLAPPY BIRD",210,235);
  ctx.font="16px Arial";
  ctx.fillText("Druk op OPNIEUW om te spelen",210,270);
 }
 requestAnimationFrame(loop);
}

document.getElementById("flyButton").addEventListener("click",flap);
document.getElementById("restartButton").addEventListener("click",resetGame);
canvas.addEventListener("pointerdown",flap);
document.addEventListener("keydown",e=>{
 if(e.code==="Space"&&document.activeElement.tagName!=="INPUT"){
  e.preventDefault();
  flap();
 }
});
resetGame();
loop();
</script>
</body>
</html>
