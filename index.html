
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STREAM WORLD</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:white;font-family:Arial,sans-serif}
header{background:#080808;padding:20px;position:sticky;top:0;z-index:5}
.logo{font-size:27px;font-weight:900;color:#ed1c24}
nav{display:flex;gap:10px;overflow-x:auto;margin-top:15px}
button{background:#292929;color:white;border:0;padding:11px 15px;border-radius:6px;cursor:pointer}
button.active{background:#e50914}
input{width:100%;padding:13px;border-radius:7px;border:0;margin-top:15px;font-size:16px}
main{padding:18px}
h2{margin-top:25px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.card{background:#222;border-radius:9px;overflow:hidden;min-height:145px}
.poster{height:105px;background:linear-gradient(135deg,#5b090d,#171717);display:flex;align-items:center;justify-content:center;font-size:38px}
.info{padding:10px}
.info strong{display:block;margin-bottom:7px}
.small{font-size:12px;color:#bbb}
a{color:#ff5555;text-decoration:none}
footer{padding:30px;text-align:center;color:#888}
</style>
</head>
<body>
<header>
<div class="logo">STREAM WORLD</div>
<div>ALL YOUR ENTERTAINMENT. ONE WORLD.</div>
<input id="search" placeholder="Zoek films, series, anime..." oninput="render()">
<nav id="nav">
<button class="active" onclick="category('Alles',this)">Alles</button>
<button onclick="category('Films',this)">Films</button>
<button onclick="category('Series',this)">Series</button>
<button onclick="category('Anime',this)">Anime</button>
<button onclick="category('Documentaires',this)">Documentaires</button>
<button onclick="category('Kinderen',this)">Kinderen</button>
</nav>
</header>
<main>
<h2 id="heading">Ontdek STREAM WORLD</h2>
<p class="small">Gratis kijken en ontdekken waar je titels officieel kunt streamen.</p>
<div class="grid" id="catalog"></div>
</main>
<footer>STREAM WORLD © 2026<br>Alle kijkrechten blijven bij de officiële aanbieders.</footer>
<script>
const titles=[
{name:"NPO Start",type:"Series",emoji:"📺",status:"Gratis aanbod",url:"https://npo.nl/start"},
{name:"NPO Doc",type:"Documentaires",emoji:"🌍",status:"Gratis aanbod",url:"https://npo.nl"},
{name:"YouTube",type:"Films",emoji:"▶️",status:"Gratis en betaald aanbod",url:"https://www.youtube.com"},
{name:"Plex",type:"Films",emoji:"🎬",status:"Gratis en betaald aanbod",url:"https://watch.plex.tv"},
{name:"Rakuten TV",type:"Films",emoji:"🍿",status:"Gratis en betaald aanbod",url:"https://www.rakuten.tv"},
{name:"Pluto TV",type:"Series",emoji:"📺",status:"Gratis aanbod",url:"https://pluto.tv"},
{name:"Crunchyroll",type:"Anime",emoji:"⛩️",status:"Gratis en betaald aanbod",url:"https://www.crunchyroll.com"},
{name:"Internet Archive",type:"Films",emoji:"🎞️",status:"Rechtenvrije en gratis titels",url:"https://archive.org/details/movies"},
{name:"Het Klokhuis",type:"Kinderen",emoji:"🧸",status:"Gratis aanbod",url:"https://hetklokhuis.nl"},
{name:"Zapp",type:"Kinderen",emoji:"⭐",status:"Gratis aanbod",url:"https://www.zapp.nl"}
];
let selected="Alles";
function category(c,b){
selected=c;
document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
render();
}
function render(){
let q=document.getElementById("search").value.toLowerCase();
let list=titles.filter(x=>(selected==="Alles"||x.type===selected)&&
(x.name.toLowerCase().includes(q)||x.type.toLowerCase().includes(q)));
document.getElementById("heading").textContent=selected==="Alles"?"Ontdek STREAM WORLD":selected;
document.getElementById("catalog").innerHTML=list.map(x=>`
<div class="card">
<div class="poster">${x.emoji}</div>
<div class="info"><strong>${x.name}</strong>
<div class="small">${x.type} · ${x.status}</div>
<p><a href="${x.url}" target="_blank" rel="noopener">Bekijk platform ↗</a></p>
</div></div>`).join("")||"<p>Geen resultaten gevonden.</p>";
}
render();
</script>
</body>
</html>
